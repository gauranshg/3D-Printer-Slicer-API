# FDM_N02_PLA_0.08mm.ini - Bambu Lab A1 with 0.2 mm nozzle (PLA)
# Speeds/accelerations/line widths mirror Bambu Studio "0.08mm High Quality @BBL A1 0.2 nozzle" +
# "Bambu PLA Basic @BBL A1 0.2 nozzle" so quoted print times match the printer.
# Selected by the website via the prusaProfile form field (nozzleSize=0.2).
# Printer settings - Bambu Lab A1 0.2 nozzle
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
gcode_flavor = marlin
nozzle_diameter = 0.2
filament_diameter = 1.75
retract_length = 0.8
retract_speed = 30
min_layer_height = 0.04
max_layer_height = 0.14

# Print settings
layer_height = 0.08
first_layer_height = 0.1
perimeters = 4
fill_density = 20%
fill_pattern = gyroid
top_solid_layers = 7
bottom_solid_layers = 5

# Line widths (mm) - Bambu 0.2 nozzle presets use 0.22 everywhere, 0.25 first layer
extrusion_width = 0.22
perimeter_extrusion_width = 0.22
external_perimeter_extrusion_width = 0.22
infill_extrusion_width = 0.22
solid_infill_extrusion_width = 0.22
top_infill_extrusion_width = 0.22
support_material_extrusion_width = 0.22
first_layer_extrusion_width = 0.25

# Speed settings (mm/s) - Bambu 0.08mm High Quality @BBL A1 0.2 nozzle
travel_speed = 700
perimeter_speed = 150
small_perimeter_speed = 50%
external_perimeter_speed = 60
infill_speed = 100
solid_infill_speed = 150
top_solid_infill_speed = 150
gap_fill_speed = 50
support_material_speed = 150
support_material_interface_speed = 80
bridge_speed = 50
first_layer_speed = 16
first_layer_infill_speed = 28

# Accelerations (mm/s²) - Bambu 0.08mm High Quality @BBL A1 0.2 nozzle
default_acceleration = 4000
external_perimeter_acceleration = 2000
perimeter_acceleration = 4000
infill_acceleration = 4000
solid_infill_acceleration = 4000
top_solid_infill_acceleration = 2000
bridge_acceleration = 4000
travel_acceleration = 10000
first_layer_acceleration = 500

# Filament limits - Bambu PLA Basic @BBL A1 0.2 nozzle
# The 0.2 mm nozzle's volumetric cap is what dominates print time.
filament_max_volumetric_speed = 2
slowdown_below_layer_time = 6
min_print_speed = 20

# Temperature (PLA - Bambu Lab A1)
nozzle_temperature = 220
first_layer_temperature = 220
bed_temperature = 65
first_layer_bed_temperature = 65

# Support
support_material = 0
support_material_auto = 1
support_material_threshold = 45

# Output options
complete_objects = 0
extruder_clearance_height = 20
extruder_clearance_radius = 20

# Time estimation parameters (Bambu Lab A1 machine limits)
gcode_comments = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 12000,12000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 12000,12000
machine_max_acceleration_x = 12000,12000
machine_max_acceleration_y = 12000,12000
machine_max_acceleration_z = 1500,1500
machine_max_feedrate_e = 30,30
machine_max_feedrate_x = 500,200
machine_max_feedrate_y = 500,200
machine_max_feedrate_z = 30,30
machine_max_jerk_e = 3,3
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 3,3
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
remaining_times = 1
