# FDM_0.3mm.ini - Bambu Lab A1 (Draft, PLA)
# Speeds/accelerations mirror Bambu Studio "0.28mm Extra Draft @BBL A1" +
# "Bambu PLA Basic @BBL A1" so quoted print times match the printer.
# Printer settings
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
gcode_flavor = marlin
nozzle_diameter = 0.4
filament_diameter = 1.75
retract_length = 0.8
retract_speed = 30

# Print settings
layer_height = 0.3
first_layer_height = 0.2
perimeters = 2
fill_density = 20%
fill_pattern = grid
solid_layers = 4
bottom_solid_layers = 3

# Speed settings (mm/s) - Bambu 0.28mm Extra Draft @BBL A1
travel_speed = 700
perimeter_speed = 200
small_perimeter_speed = 50%
external_perimeter_speed = 200
infill_speed = 200
solid_infill_speed = 200
top_solid_infill_speed = 200
gap_fill_speed = 200
support_material_speed = 150
support_material_interface_speed = 80
bridge_speed = 50
first_layer_speed = 50
first_layer_infill_speed = 105

# Accelerations (mm/s²) - Bambu 0.28mm Extra Draft @BBL A1
default_acceleration = 6000
external_perimeter_acceleration = 5000
perimeter_acceleration = 6000
infill_acceleration = 6000
solid_infill_acceleration = 6000
top_solid_infill_acceleration = 2000
bridge_acceleration = 6000
travel_acceleration = 10000
first_layer_acceleration = 500

# Filament limits - Bambu PLA Basic @BBL A1
filament_max_volumetric_speed = 21
slowdown_below_layer_time = 6
min_print_speed = 20

# Temperature (PLA - Bambu Lab A1)
nozzle_temperature = 220
first_layer_temperature = 220
bed_temperature = 55
first_layer_bed_temperature = 55

# Support
support_material = 0
support_material_auto = 1
support_material_threshold = 45

# Output options
complete_objects = 0
extruder_clearance_height = 20
extruder_clearance_radius = 20

# Time estimation parameters (Bambu Lab A1 machine limits)
gcode_comments = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 12000,12000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 12000,12000
machine_max_acceleration_x = 12000,12000
machine_max_acceleration_y = 12000,12000
machine_max_acceleration_z = 1500,1500
machine_max_feedrate_e = 30,30
machine_max_feedrate_x = 500,200
machine_max_feedrate_y = 500,200
machine_max_feedrate_z = 30,30
machine_max_jerk_e = 3,3
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 3,3
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0
remaining_times = 1
