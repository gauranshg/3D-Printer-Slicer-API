name: Publish cloud slicer image

on:
  push:
    branches: [cloud-deploy-a1]
    paths:
      - 'app/services/slice/engine.js'
      - 'app/services/slice/errors.js'
      - 'app/services/slice/model-stats.js'
      - 'Dockerfile.cloud-patch'
      - '.github/workflows/publish-cloud-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-patch
          push: true
          tags: ghcr.io/gauranshg/3d-psa:cloud-${{ github.sha }}
